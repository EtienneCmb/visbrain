[tox]
minversion = 4.11.0
env_list =
    pre-commit
    lint
    lint-format
    type
    tests
    package
    tests-screenshot

[testenv]
deps = -r requirements/dev.txt

[testenv:pre-commit]
description = Run the configured pre-commit hooks across the repository
skip_install = true
commands =
    pre-commit run --all-files

[testenv:lint]
description = Run Ruff against the repository
skip_install = true
commands =
    python tools/generate_qt_ui.py --check
    ruff check {posargs:.}

[testenv:lint-format]
description = Check Black formatting
skip_install = true
deps =
    black==24.4.2
commands =
    black --check {posargs:tools}

[testenv:type]
description = Run static type checks with mypy
skip_install = true
commands =
    mypy {posargs:visbrain/qt.py visbrain/io/cache.py visbrain/utils/logging.py visbrain/utils/cameras.py}

[testenv:tests]
description = Run the test suite headlessly with coverage
setenv =
    QT_QPA_PLATFORM = offscreen
    PYTHONWARNINGS = default
    PYTEST_ADDOPTS = --import-mode=importlib
passenv =
    PYTEST_MARK
commands =
    python -m pytest {posargs:tests} -m "{env:PYTEST_MARK:not gui}" --cov=visbrain --cov-report=term-missing -ra

[testenv:tests-screenshot]
description = Run only the screenshot regression suite
setenv =
    QT_QPA_PLATFORM = offscreen
    PYTHONWARNINGS = default
    PYTEST_ADDOPTS = --import-mode=importlib
commands =
    python -m pytest -m screenshot visbrain/gui/tests/test_regressions.py {posargs}

[testenv:package]
description = Build sdist and wheel artifacts
skip_install = true
commands =
    python -m build {posargs}
