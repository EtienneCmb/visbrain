name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: |
          python -m pip install -r requirements/dev.txt
          rm -rf dist
          python -m build
        env:
          PYTHONWARNINGS: ignore

      - name: Inspect dist directory
        run: ls -R dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test wheel installation (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - <<'PY'
import importlib
import pkgutil
pkg = importlib.import_module('visbrain')
print('Loaded', pkg.__name__, 'from', pkg.__file__)
print('Available submodules:', [m.name for m in pkgutil.iter_modules(pkg.__path__)])
PY

      - name: Smoke test wheel installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv-smoke
          .\.venv-smoke\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install dist\*.whl
          python -c "import importlib, pkgutil; pkg = importlib.import_module('visbrain'); print(f'Loaded {pkg.__name__} from {pkg.__file__}'); print('Available submodules:', [m.name for m in pkgutil.iter_modules(pkg.__path__)])"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix['python-version'] }}
          path: dist
          if-no-files-found: error
